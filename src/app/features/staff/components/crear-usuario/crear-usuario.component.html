<div class="p-4">

  <form nz-form nzLayout="vertical" (ngSubmit)="onCreateStaff()">
    <div nz-row [nzGutter]="[16, 0]">

      <!-- Columna Izquierda -->
      <div nz-col [nzXs]="24" [nzMd]="12">
        <nz-form-item>
          <nz-form-label nzRequired>Usuario</nz-form-label>
          <nz-form-control nzErrorTip="Por favor ingrese un nombre de usuario">
            <nz-input-group>
              <input type="text" nz-input [(ngModel)]="username" name="username" placeholder="Nombre de usuario" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>Correo</nz-form-label>
          <nz-form-control nzErrorTip="Por favor ingrese un correo válido">
            <nz-input-group>
              <input type="email" nz-input [(ngModel)]="email" name="email" placeholder="Correo electrónico" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>Contraseña</nz-form-label>
          <nz-form-control nzErrorTip="La contraseña debe tener al menos 6 caracteres">
            <nz-input-group>
              <input type="password" nz-input [(ngModel)]="password" name="password" placeholder="Contraseña" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>Teléfono</nz-form-label>
          <nz-form-control nzErrorTip="Por favor ingrese un número de teléfono">
            <nz-input-group>
              <input type="text" nz-input [(ngModel)]="phone" name="phone" placeholder="Número de teléfono" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>
      </div>

      <!-- Columna Derecha -->
      <div nz-col [nzXs]="24" [nzMd]="12">
        <nz-form-item>
          <nz-form-label nzRequired>Tipo y № Documento</nz-form-label>
          <nz-form-control nzErrorTip="Por favor ingrese su número de documento">
            <nz-input-group nzCompact class="w-full">
              <nz-select [(ngModel)]="type_documento" name="type_documento" nzPlaceHolder="Tipo" nzAllowClear
                style="width: 100px;">
                <nz-option nzValue="DNI" nzLabel="DNI"></nz-option>
                <nz-option nzValue="Pasaporte" nzLabel="Pasaporte"></nz-option>
                <nz-option nzValue="Carnet de Extranjería" nzLabel="C.E."></nz-option>
                <nz-option nzValue="PTP" nzLabel="PTP"></nz-option>
              </nz-select>
              <input type="text" nz-input [(ngModel)]="n_documento" name="n_documento" placeholder="Número de documento"
                style="width: calc(100% - 100px);" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>Fecha de Nacimiento</nz-form-label>
          <nz-form-control nzErrorTip="Por favor seleccione su fecha de nacimiento">
            <nz-date-picker [(ngModel)]="birthday" name="birthday" nzFormat="yyyy-MM-dd" class="w-full"></nz-date-picker>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>Rol del Usuario</nz-form-label>
          <nz-form-control nzErrorTip="Por favor seleccione un rol">
            <nz-select [(ngModel)]="roles" name="roleId" nzPlaceHolder="Seleccione un rol" nzAllowClear class="w-full">
              @for (role of roles$(); track role.id) {
              <nz-option [nzValue]="role.id" [nzLabel]="role.name"></nz-option>
              }
            </nz-select>
          </nz-form-control>
        </nz-form-item>

        <!-- Avatar -->
        <nz-form-item>
          <nz-form-label nzRequired>Imagen de Perfil</nz-form-label>
          <nz-form-control>
            <div class="flex flex-col items-center gap-3">
              <nz-avatar [nzSize]="80" [nzSrc]="imagen_previsualiza" nzIcon="user" nzShape="circle">
              </nz-avatar>
              <button type="button" nz-button nzSize="small" (click)="fileInput.click()">
                <span nz-icon nzType="upload"></span> Subir imagen
              </button>
              <input #fileInput type="file" accept="image/*" class="hidden" (change)="processFile($event)" />
              <span class="text-xs text-gray-400">Archivos: JPG, PNG</span>
            </div>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <!-- Action Buttons -->
    <nz-divider></nz-divider>
    <div class="flex justify-end gap-2">
      <button nz-button nzType="default" (click)="modalRef.close(false)" type="button">
        <span nz-icon nzType="close-circle"></span> Cancelar
      </button>
      <button nz-button nzType="primary" type="submit">
        <span nz-icon nzType="save"></span> Registrar Usuario
      </button>
    </div>
  </form>

</div>
