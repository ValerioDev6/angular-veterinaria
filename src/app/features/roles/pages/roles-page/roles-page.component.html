<div class="p-6">

  <!-- Header -->
  <nz-card nzTitle="Gestión de Roles" [nzExtra]="extraTemplate" [nzBodyStyle]="{ padding: 0 }" class="mb-4">

    <ng-template #extraTemplate>
      <nz-space>
        <nz-input-group *nzSpaceItem [nzSuffix]="suffixIconSearch" nzSize="default" style="width: 240px">
          <input type="text" nz-input placeholder="Buscar rol por nombre" [ngModel]="searchTerm()"
            (ngModelChange)="searchTerm.set($event)" (keyup.enter)="onSearch()" />
        </nz-input-group>
        <button *nzSpaceItem nz-button nzType="default" (click)="refreshData()" nz-tooltip
          nzTooltipTitle="Refrescar datos">
          <span nz-icon nzType="sync" nzTheme="outline"></span>
        </button>
        <button *nzSpaceItem nz-button nzType="default" nz-tooltip nzTooltipTitle="Exportar a PDF">
          <span nz-icon nzType="file-pdf" nzTheme="fill"></span>
        </button>
        <button *nzSpaceItem nz-button nzType="default" nz-tooltip nzTooltipTitle="Exportar a Excel">
          <span nz-icon nzType="file-excel" nzTheme="fill"></span>
        </button>
        <ng-container *hasPermission="PERMISOS.REGISTER_ROL">
          <button *nzSpaceItem nz-button nzType="primary" (click)="openModal()">
            <span nz-icon nzType="plus"></span>
            Nuevo Rol
          </button>
        </ng-container>
      </nz-space>
    </ng-template>

    <ng-template #suffixIconSearch>
      <span nz-icon nzType="search"></span>
    </ng-template>
  </nz-card>

  <!-- Tabla -->
  <nz-card>
    <nz-table #basicTable [nzData]="roles()" [nzLoading]="isLoading()" [nzPageSize]="limit()" [nzTotal]="total()"
      [nzFrontPagination]="false" (nzPageIndexChange)="pageChanged($event)" [nzPageSizeOptions]="[5, 10, 20, 50]"
      (nzPageSizeChange)="changePageSize($event)" [nzShowSizeChanger]="true" [nzBordered]="true"
      [nzShowQuickJumper]="true">
      <thead>
        <tr>
          <th>Rol</th>
          <th>Creado en</th>
          <th>Permisos</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (rol of roles(); track rol.id) {
        <tr>
          <td>{{ rol.name }}</td>
          <td>{{ rol.created_at | date : "short" }}</td>
          <td>
            @if (rol.role_permissions && rol.role_permissions.length > 0) {
            <div class="flex flex-wrap gap-1">
              @for (perm of rol.role_permissions; track perm.id) {
              <nz-tag nzColor="blue">{{ perm.permissions.action }}</nz-tag>
              }
            </div>
            } @else {
            <span class="text-gray-400"><i>Sin permisos</i></span>
            }
          </td>
          <td>
            <nz-space>
              <button *nzSpaceItem (click)="openEditModal(rol)" nz-button nzType="primary" nzSize="small"
                nzShape="circle" nz-tooltip [nzTooltipTitle]="'Editar rol'">
                <span nz-icon nzType="edit" nzTheme="outline"></span>
              </button>
              <button *nzSpaceItem (click)="viewRol(rol)" nz-button nzType="default" nzSize="small"
                nzShape="circle" nz-tooltip [nzTooltipTitle]="'Ver rol'">
                <span nz-icon nzType="eye" nzTheme="outline"></span>
              </button>
              <button *nzSpaceItem nz-button nzType="primary" nzDanger nzSize="small" nzShape="circle"
                (click)="showDeleteConfirmModal(rol)" nz-tooltip [nzTooltipTitle]="'Eliminar rol'">
                <span nz-icon nzType="delete" nzTheme="outline"></span>
              </button>
            </nz-space>
          </td>
        </tr>
        }
      </tbody>
    </nz-table>
  </nz-card>

</div>
