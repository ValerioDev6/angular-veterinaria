<div class="p-4">
  <!-- Info del servicio con nz-card y nz-descriptions -->
  <nz-card nzTitle="Detalles del Servicio" class="mb-4" [nzBordered]="false" nzSize="small">
    <nz-descriptions [nzColumn]="1" nzSize="small">
      <nz-descriptions-item nzTitle="Mascota">
        <span class="font-semibold">{{ pago.pet.name }}</span>
      </nz-descriptions-item>
      <nz-descriptions-item nzTitle="Tipo">
        <nz-tag [nzColor]="pago.tipo === 'CITA' ? 'blue' : pago.tipo === 'VACUNA' ? 'geekblue' : 'purple'">
          {{ pago.tipo }}
        </nz-tag>
      </nz-descriptions-item>
      <nz-descriptions-item nzTitle="Monto Total">
        <span class="text-lg font-semibold">S/ {{ pago.monto | number: '1.2-2' }}</span>
      </nz-descriptions-item>
      <nz-descriptions-item nzTitle="Pagado">
        <span class="text-green-600">S/ {{ pago.adelanto | number: '1.2-2' }}</span>
      </nz-descriptions-item>
      <nz-descriptions-item nzTitle="Deuda Pendiente">
        <nz-statistic 
          [nzValue]="deudaPendiente" 
          nzPrefix="S/" 
          [nzValueStyle]="{ color: '#ff4d4f' }">
        </nz-statistic>
      </nz-descriptions-item>
    </nz-descriptions>
  </nz-card>

  <!-- Formulario -->
  <form nz-form nzLayout="vertical">
    <nz-form-item>
      <nz-form-label nzRequired>Monto a Pagar</nz-form-label>
      <nz-form-control>
        <nz-input-number 
          [(ngModel)]="formData.monto" 
          name="monto" 
          [nzMin]="0" 
          [nzMax]="deudaPendiente" 
          [nzStep]="0.01"
          nzPlaceHolder="Ingrese monto" 
          style="width: 100%">
        </nz-input-number>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzRequired>Método de Pago</nz-form-label>
      <nz-form-control>
        <nz-select [(ngModel)]="formData.metodo_pago" name="metodo_pago" style="width: 100%">
          <nz-option nzValue="efectivo" nzLabel="Efectivo"></nz-option>
          <nz-option nzValue="tarjeta" nzLabel="Tarjeta"></nz-option>
          <nz-option nzValue="transferencia" nzLabel="Transferencia"></nz-option>
          <nz-option nzValue="yape" nzLabel="Yape"></nz-option>
          <nz-option nzValue="plin" nzLabel="Plin"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <!-- Botones -->
    <div class="flex justify-end gap-2 mt-4">
      <button nz-button nzType="default" (click)="cancel()">
        <nz-icon nzType="close-circle" nzTheme="outline" class="mr-2"></nz-icon>
        Cancelar
      </button>
      <button nz-button nzType="primary" (click)="submitForm()"
        [disabled]="formData.monto <= 0 || formData.monto > deudaPendiente">
        <nz-icon nzType="save" nzTheme="outline" class="mr-2"></nz-icon>
        Registrar Pago
      </button>
    </div>
  </form>
</div>
